<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-layout="spine" role="img" aria-label="Webex App optimized media">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c1d95"/><stop offset="0.55" stop-color="#6d28d9"/><stop offset="1" stop-color="#9d174d"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="900" fill="url(#sky)"/>
<g opacity="0.5">
<animateTransform attributeName="transform" type="translate" values="0 0; 0 20; 0 0" dur="13s" repeatCount="indefinite"/>
<circle cx="214" cy="150" r="110" fill="#c4b5fd" opacity="0.22"/>
<circle cx="906" cy="240" r="80" fill="#f9a8d4" opacity="0.2"/>
<circle cx="640" cy="780" r="130" fill="#fde68a" opacity="0.14"/>
</g>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0; -16 10; 0 0" dur="18s" repeatCount="indefinite"/>
<g opacity="0.35"><ellipse cx="600" cy="500" rx="80" ry="50" fill="none" stroke="#e9d5ff" stroke-width="2"/>
<ellipse cx="600" cy="500" rx="150" ry="96" fill="none" stroke="#e9d5ff" stroke-width="2"/>
<ellipse cx="600" cy="500" rx="220" ry="142" fill="none" stroke="#e9d5ff" stroke-width="2"/>
<ellipse cx="600" cy="500" rx="290" ry="188" fill="none" stroke="#e9d5ff" stroke-width="2"/>
<ellipse cx="600" cy="500" rx="360" ry="234" fill="none" stroke="#e9d5ff" stroke-width="2"/>
<ellipse cx="600" cy="500" rx="430" ry="280" fill="none" stroke="#e9d5ff" stroke-width="2"/></g>
</g>
<text x="64" y="68" fill="#f8fafc" font-size="40" font-family="system-ui,sans-serif" font-weight="800">Webex App optimized media</text>
<text x="64" y="104" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">When ICE succeeds inside the org, media can go direct on these ranges.</text>
<path d="M 600 240 L 600 400 L 600 560 L 600 720" fill="none" stroke="#fb7185" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
<g class="hop"><rect x="438.0" y="204.0" width="340" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="430.0" y="192.0" width="340" height="96" rx="20" fill="#c4b5fd"/><rect x="430.0" y="192.0" width="340" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="600" y="246.0" text-anchor="middle" fill="#082f49" font-size="17" font-family="system-ui,sans-serif" font-weight="800">App audio 8500-8599</text><text x="600" y="270.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 1</text></g>
<g class="hop"><rect x="438.0" y="364.0" width="340" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="430.0" y="352.0" width="340" height="96" rx="20" fill="#f9a8d4"/><rect x="430.0" y="352.0" width="340" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="600" y="406.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">ICE success</text><text x="600" y="430.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 2</text></g>
<g class="hop"><rect x="438.0" y="524.0" width="340" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="430.0" y="512.0" width="340" height="96" rx="20" fill="#fde68a"/><rect x="430.0" y="512.0" width="340" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="600" y="566.0" text-anchor="middle" fill="#082f49" font-size="17" font-family="system-ui,sans-serif" font-weight="800">App video 8600-8699</text><text x="600" y="590.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 3</text></g>
<g class="hop"><rect x="438.0" y="684.0" width="340" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="430.0" y="672.0" width="340" height="96" rx="20" fill="#fb7185"/><rect x="430.0" y="672.0" width="340" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="600" y="726.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Peer app</text><text x="600" y="750.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 4</text></g>
<g filter="url(#glow)">
<animateMotion dur="5.9s" repeatCount="indefinite" path="M 600 240 L 600 400 L 600 560 L 600 720"/>
<circle r="16" fill="#fb7185" opacity="0.55"/>
<circle r="7" fill="#ffffff"/>
</g>
<text x="64" y="860" fill="#bae6fd" font-size="16" font-family="system-ui,sans-serif">Study drawing. Read the room before you treat a hop as a product limit.</text>
</svg>
