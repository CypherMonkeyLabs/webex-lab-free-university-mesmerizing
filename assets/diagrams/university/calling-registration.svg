<text x="64" y="68" fill="#f8fafc" font-size="40" font-family="system-ui,sans-serif" font-weight="800">Calling registration</text>
<text x="64" y="104" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">SIP TLS toward the cloud. Endpoints do not register through the Local Gateway.</text>
<path d="M 260 250 L 480 400 L 720 550 L 960 700" fill="none" stroke="#fb7185" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
<g class="hop"><rect x="143.0" y="214.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="135.0" y="202.0" width="250" height="96" rx="20" fill="#fdba74"/><rect x="135.0" y="202.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="260" y="256.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Phone</text><text x="260" y="280.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 1</text></g>
<g class="hop"><rect x="363.0" y="364.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="355.0" y="352.0" width="250" height="96" rx="20" fill="#fecdd3"/><rect x="355.0" y="352.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="480" y="406.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">DNS / SRV</text><text x="480" y="430.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 2</text></g>
<g class="hop"><rect x="603.0" y="514.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="595.0" y="502.0" width="250" height="96" rx="20" fill="#fde68a"/><rect x="595.0" y="502.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="720" y="556.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Webex Calling</text><text x="720" y="580.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 3</text></g>
<g class="hop"><rect x="843.0" y="664.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="835.0" y="652.0" width="250" height="96" rx="20" fill="#fb7185"/><rect x="835.0" y="652.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="960" y="706.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Control Hub</text><text x="960" y="730.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 4</text></g>
<g filter="url(#glow)">
<animateMotion dur="6.6s" repeatCount="indefinite" path="M 260 250 L 480 400 L 720 550 L 960 700"/>
<circle r="16" fill="#fb7185" opacity="0.55"/>
<circle r="7" fill="#ffffff"/>
</g>
<text x="64" y="860" fill="#bae6fd" font-size="16" font-family="system-ui,sans-serif">Study drawing. Read the room before you treat a hop as a product limit.</text>
