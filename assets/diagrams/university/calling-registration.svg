<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-layout="stairs-right" role="img" aria-label="Calling registration">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c2d12"/><stop offset="0.55" stop-color="#b45309"/><stop offset="1" stop-color="#9f1239"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="900" fill="url(#sky)"/>
<g opacity="0.5">
<animateTransform attributeName="transform" type="translate" values="0 0; 0 24; 0 0" dur="14s" repeatCount="indefinite"/>
<circle cx="251" cy="150" r="110" fill="#fdba74" opacity="0.22"/>
<circle cx="929" cy="240" r="80" fill="#fecdd3" opacity="0.2"/>
<circle cx="640" cy="780" r="130" fill="#fde68a" opacity="0.14"/>
</g>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0; -16 10; 0 0" dur="18s" repeatCount="indefinite"/>
<g opacity="0.22" stroke="#fed7aa" stroke-width="8"><line x1="0" y1="0" x2="1200" y2="200" />
<line x1="0" y1="90" x2="1200" y2="270" />
<line x1="0" y1="180" x2="1200" y2="340" />
<line x1="0" y1="270" x2="1200" y2="410" />
<line x1="0" y1="360" x2="1200" y2="480" />
<line x1="0" y1="450" x2="1200" y2="550" />
<line x1="0" y1="540" x2="1200" y2="620" />
