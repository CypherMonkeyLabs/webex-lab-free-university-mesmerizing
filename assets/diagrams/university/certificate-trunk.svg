<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 240" role="img" aria-label="Certificate trunk">
<rect width="980" height="240" rx="20" fill="#0b1020"/>
<text x="28" y="40" fill="#f8fafc" font-size="22" font-family="system-ui,sans-serif" font-weight="700">Certificate trunk</text>
<text x="28" y="64" fill="#94a3b8" font-size="13" font-family="system-ui,sans-serif">Certificate-based trunks use destination TCP 5062. The FQDN must match the certificate.</text>
