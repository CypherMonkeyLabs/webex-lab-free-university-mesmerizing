<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-layout="plus" role="img" aria-label="Firewall lanes">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f6212"/><stop offset="0.55" stop-color="#4d7c0f"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="900" fill="url(#sky)"/>
<g opacity="0.5">
<animateTransform attributeName="transform" type="translate" values="0 0; 0 24; 0 0" dur="12s" repeatCount="indefinite"/>
<circle cx="341" cy="150" r="110" fill="#a3e635" opacity="0.22"/>
<circle cx="939" cy="240" r="80" fill="#5eead4" opacity="0.2"/>
<circle cx="640" cy="780" r="130" fill="#fef08a" opacity="0.14"/>
</g>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0; -16 10; 0 0" dur="18s" repeatCount="indefinite"/>
<g opacity="0.28" stroke="#d9f99d" stroke-width="2"><line x1="600" y1="480" x2="1120" y2="480" />
<line x1="600" y1="480" x2="1051" y2="648" />
<line x1="600" y1="480" x2="863" y2="773" />
<line x1="600" y1="480" x2="605" y2="819" />
<line x1="600" y1="480" x2="347" y2="776" />
<line x1="600" y1="480" x2="155" y2="655" />
<line x1="600" y1="480" x2="81" y2="487" />
<line x1="600" y1="480" x2="144" y2="318" />
<line x1="600" y1="480" x2="328" y2="191" />
<line x1="600" y1="480" x2="584" y2="141" />
<line x1="600" y1="480" x2="843" y2="180" />
<line x1="600" y1="480" x2="1039" y2="299" /></g>
</g>
<text x="64" y="68" fill="#f8fafc" font-size="40" font-family="system-ui,sans-serif" font-weight="800">Firewall lanes</text>
<text x="64" y="104" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">Filter HTTPS by domain. Filter signaling and media by port and the article&#x27;s IP</text>
<text x="64" y="128" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">subnets. Do not paste subnets from memory.</text>
<path d="M 600 240 L 300 480 L 900 480 L 600 720" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
<g class="hop"><rect x="483.0" y="204.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="475.0" y="192.0" width="250" height="96" rx="20" fill="#a3e635"/><rect x="475.0" y="192.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="600" y="246.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">HTTPS domains</text><text x="600" y="270.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 1</text></g>
<g class="hop"><rect x="183.0" y="444.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="175.0" y="432.0" width="250" height="96" rx="20" fill="#5eead4"/><rect x="175.0" y="432.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="300" y="486.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">SIP TLS</text><text x="300" y="510.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 2</text></g>
<g class="hop"><rect x="783.0" y="444.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="775.0" y="432.0" width="250" height="96" rx="20" fill="#fef08a"/><rect x="775.0" y="432.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="900" y="486.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">SRTP UDP</text><text x="900" y="510.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 3</text></g>
<g class="hop"><rect x="483.0" y="684.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="475.0" y="672.0" width="250" height="96" rx="20" fill="#34d399"/><rect x="475.0" y="672.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="600" y="726.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">DNS and NTP</text><text x="600" y="750.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 4</text></g>
<g filter="url(#glow)">
<animateMotion dur="6.6s" repeatCount="indefinite" path="M 600 240 L 300 480 L 900 480 L 600 720"/>
<circle r="16" fill="#34d399" opacity="0.55"/>
<circle r="7" fill="#ffffff"/>
</g>
<text x="64" y="860" fill="#bae6fd" font-size="16" font-family="system-ui,sans-serif">Study drawing. Read the room before you treat a hop as a product limit.</text>
</svg>
