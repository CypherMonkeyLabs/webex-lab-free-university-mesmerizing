<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-layout="ellipse" role="img" aria-label="NAT and SIP ALG">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="0.55" stop-color="#3730a3"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="900" fill="url(#sky)"/>
<g opacity="0.5">
<animateTransform attributeName="transform" type="translate" values="0 0; 0 28; 0 0" dur="12s" repeatCount="indefinite"/>
<circle cx="283" cy="150" r="110" fill="#a5b4fc" opacity="0.22"/>
<circle cx="1077" cy="240" r="80" fill="#5eead4" opacity="0.2"/>
<circle cx="640" cy="780" r="130" fill="#fde68a" opacity="0.14"/>
</g>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0; -16 10; 0 0" dur="18s" repeatCount="indefinite"/>
<g opacity="0.16"><rect x="0" y="200" width="1200" height="18" fill="#c7d2fe"/>
<rect x="0" y="280" width="1200" height="18" fill="#c7d2fe"/>
<rect x="0" y="360" width="1200" height="18" fill="#c7d2fe"/>
<rect x="0" y="440" width="1200" height="18" fill="#c7d2fe"/>
<rect x="0" y="520" width="1200" height="18" fill="#c7d2fe"/>
<rect x="0" y="600" width="1200" height="18" fill="#c7d2fe"/>
<rect x="0" y="680" width="1200" height="18" fill="#c7d2fe"/></g>
</g>
<text x="64" y="68" fill="#f8fafc" font-size="40" font-family="system-ui,sans-serif" font-weight="800">NAT and SIP ALG</text>
<text x="64" y="104" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">Phones may reuse SIP source ports. Strict source-port preservation breaks registration.</text>
<text x="64" y="128" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">Turn SIP ALG off.</text>
<path d="M 860 360 L 700 680 L 340 620 L 280 340" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
<g class="hop"><rect x="743.0" y="324.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="735.0" y="312.0" width="250" height="96" rx="20" fill="#a5b4fc"/><rect x="735.0" y="312.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="860" y="366.0" text-anchor="middle" fill="#082f49" font-size="17" font-family="system-ui,sans-serif" font-weight="800">Overlapping 5060-5280</text><text x="860" y="390.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 1</text></g>
<g class="hop"><rect x="583.0" y="644.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="575.0" y="632.0" width="250" height="96" rx="20" fill="#5eead4"/><rect x="575.0" y="632.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="700" y="686.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">PAT</text><text x="700" y="710.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 2</text></g>
<g class="hop"><rect x="223.0" y="584.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="215.0" y="572.0" width="250" height="96" rx="20" fill="#fde68a"/><rect x="215.0" y="572.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="340" y="626.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Unique source</text><text x="340" y="650.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 3</text></g>
<g class="hop"><rect x="163.0" y="304.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="155.0" y="292.0" width="250" height="96" rx="20" fill="#22d3ee"/><rect x="155.0" y="292.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="280" y="346.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">SIP ALG off</text><text x="280" y="370.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 4</text></g>
<g filter="url(#glow)">
<animateMotion dur="7.3s" repeatCount="indefinite" path="M 860 360 L 700 680 L 340 620 L 280 340"/>
<circle r="16" fill="#22d3ee" opacity="0.55"/>
<circle r="7" fill="#ffffff"/>
</g>
<text x="64" y="860" fill="#bae6fd" font-size="16" font-family="system-ui,sans-serif">Study drawing. Read the room before you treat a hop as a product limit.</text>
</svg>
