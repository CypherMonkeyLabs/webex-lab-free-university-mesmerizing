<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-layout="clock" role="img" aria-label="Call recording">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#064e3b"/><stop offset="0.55" stop-color="#047857"/><stop offset="1" stop-color="#854d0e"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="900" fill="url(#sky)"/>
<g opacity="0.5">
<animateTransform attributeName="transform" type="translate" values="0 0; 0 24; 0 0" dur="16s" repeatCount="indefinite"/>
<circle cx="151" cy="150" r="110" fill="#34d399" opacity="0.22"/>
<circle cx="949" cy="240" r="80" fill="#fbbf24" opacity="0.2"/>
<circle cx="640" cy="780" r="130" fill="#fef9c3" opacity="0.14"/>
</g>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0; -16 10; 0 0" dur="18s" repeatCount="indefinite"/>
<g opacity="0.35"><ellipse cx="600" cy="500" rx="80" ry="50" fill="none" stroke="#a7f3d0" stroke-width="2"/>
<ellipse cx="600" cy="500" rx="150" ry="96" fill="none" stroke="#a7f3d0" stroke-width="2"/>
<ellipse cx="600" cy="500" rx="220" ry="142" fill="none" stroke="#a7f3d0" stroke-width="2"/>
<ellipse cx="600" cy="500" rx="290" ry="188" fill="none" stroke="#a7f3d0" stroke-width="2"/>
<ellipse cx="600" cy="500" rx="360" ry="234" fill="none" stroke="#a7f3d0" stroke-width="2"/>
<ellipse cx="600" cy="500" rx="430" ry="280" fill="none" stroke="#a7f3d0" stroke-width="2"/></g>
</g>
<text x="64" y="68" fill="#f8fafc" font-size="40" font-family="system-ui,sans-serif" font-weight="800">Call recording</text>
<text x="64" y="104" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">Choose the provider before you enable users. Processing media disables Calling</text>
<text x="64" y="128" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">end-to-end encryption.</text>
<path d="M 600 230 L 900 470 L 600 720 L 300 470" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
<g class="hop"><rect x="483.0" y="194.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="475.0" y="182.0" width="250" height="96" rx="20" fill="#34d399"/><rect x="475.0" y="182.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="600" y="236.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Call</text><text x="600" y="260.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 1</text></g>
<g class="hop"><rect x="783.0" y="434.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="775.0" y="422.0" width="250" height="96" rx="20" fill="#fbbf24"/><rect x="775.0" y="422.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="900" y="476.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Provider</text><text x="900" y="500.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 2</text></g>
<g class="hop"><rect x="483.0" y="684.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="475.0" y="672.0" width="250" height="96" rx="20" fill="#fef9c3"/><rect x="475.0" y="672.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="600" y="726.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Webex or Dubber</text><text x="600" y="750.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 3</text></g>
<g class="hop"><rect x="183.0" y="434.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="175.0" y="422.0" width="250" height="96" rx="20" fill="#f59e0b"/><rect x="175.0" y="422.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="300" y="476.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Media processed</text><text x="300" y="500.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 4</text></g>
<g filter="url(#glow)">
<animateMotion dur="6.6s" repeatCount="indefinite" path="M 600 230 L 900 470 L 600 720 L 300 470"/>
<circle r="16" fill="#f59e0b" opacity="0.55"/>
<circle r="7" fill="#ffffff"/>
</g>
<text x="64" y="860" fill="#bae6fd" font-size="16" font-family="system-ui,sans-serif">Study drawing. Read the room before you treat a hop as a product limit.</text>
</svg>
