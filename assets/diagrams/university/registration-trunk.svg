<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-layout="river" role="img" aria-label="Registration trunk">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#1e293b"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="900" fill="url(#sky)"/>
<g opacity="0.5">
<animateTransform attributeName="transform" type="translate" values="0 0; 0 28; 0 0" dur="11s" repeatCount="indefinite"/>
<circle cx="188" cy="150" r="110" fill="#38bdf8" opacity="0.22"/>
<circle cx="972" cy="240" r="80" fill="#f8fafc" opacity="0.2"/>
<circle cx="640" cy="780" r="130" fill="#fbbf24" opacity="0.14"/>
</g>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0; -16 10; 0 0" dur="18s" repeatCount="indefinite"/>
<g opacity="0.22" stroke="#bae6fd" stroke-width="8"><line x1="0" y1="0" x2="1200" y2="200" />
<line x1="0" y1="90" x2="1200" y2="270" />
<line x1="0" y1="180" x2="1200" y2="340" />
<line x1="0" y1="270" x2="1200" y2="410" />
<line x1="0" y1="360" x2="1200" y2="480" />
<line x1="0" y1="450" x2="1200" y2="550" />
<line x1="0" y1="540" x2="1200" y2="620" />
<line x1="0" y1="630" x2="1200" y2="690" />
<line x1="0" y1="720" x2="1200" y2="760" />
<line x1="0" y1="810" x2="1200" y2="830" /></g>
</g>
<text x="64" y="68" fill="#f8fafc" font-size="40" font-family="system-ui,sans-serif" font-weight="800">Registration trunk</text>
<text x="64" y="104" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">Registration-based trunks use destination TCP 8934. The Canon records a 250-call CUBE</text>
<text x="64" y="128" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">cap for that mode.</text>
<path d="M 260 300 L 800 380 L 340 560 L 900 700" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
<g class="hop"><rect x="143.0" y="264.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="135.0" y="252.0" width="250" height="96" rx="20" fill="#38bdf8"/><rect x="135.0" y="252.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="260" y="306.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">CUBE</text><text x="260" y="330.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 1</text></g>
<g class="hop"><rect x="683.0" y="344.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="675.0" y="332.0" width="250" height="96" rx="20" fill="#f8fafc"/><rect x="675.0" y="332.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="800" y="386.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">REGISTER</text><text x="800" y="410.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 2</text></g>
<g class="hop"><rect x="223.0" y="524.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="215.0" y="512.0" width="250" height="96" rx="20" fill="#fbbf24"/><rect x="215.0" y="512.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="340" y="566.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">TCP 8934</text><text x="340" y="590.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 3</text></g>
<g class="hop"><rect x="783.0" y="664.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="775.0" y="652.0" width="250" height="96" rx="20" fill="#22d3ee"/><rect x="775.0" y="652.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="900" y="706.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Webex Calling</text><text x="900" y="730.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 4</text></g>
<g filter="url(#glow)">
<animateMotion dur="7.3s" repeatCount="indefinite" path="M 260 300 L 800 380 L 340 560 L 900 700"/>
<circle r="16" fill="#22d3ee" opacity="0.55"/>
<circle r="7" fill="#ffffff"/>
</g>
<text x="64" y="860" fill="#bae6fd" font-size="16" font-family="system-ui,sans-serif">Study drawing. Read the room before you treat a hop as a product limit.</text>
</svg>
