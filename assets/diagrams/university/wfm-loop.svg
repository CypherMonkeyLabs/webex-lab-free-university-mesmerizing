<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-layout="shelf" role="img" aria-label="WFM study loop">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#713f12"/><stop offset="0.55" stop-color="#a16207"/><stop offset="1" stop-color="#9f1239"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="900" fill="url(#sky)"/>
<g opacity="0.5">
<animateTransform attributeName="transform" type="translate" values="0 0; 0 16; 0 0" dur="13s" repeatCount="indefinite"/>
<circle cx="262" cy="150" r="110" fill="#fcd34d" opacity="0.22"/>
<circle cx="1018" cy="240" r="80" fill="#fb7185" opacity="0.2"/>
<circle cx="640" cy="780" r="130" fill="#fef3c7" opacity="0.14"/>
</g>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0; -16 10; 0 0" dur="18s" repeatCount="indefinite"/>
<g opacity="0.16"><rect x="0" y="200" width="1200" height="18" fill="#fde68a"/>
<rect x="0" y="280" width="1200" height="18" fill="#fde68a"/>
<rect x="0" y="360" width="1200" height="18" fill="#fde68a"/>
<rect x="0" y="440" width="1200" height="18" fill="#fde68a"/>
<rect x="0" y="520" width="1200" height="18" fill="#fde68a"/>
<rect x="0" y="600" width="1200" height="18" fill="#fde68a"/>
<rect x="0" y="680" width="1200" height="18" fill="#fde68a"/></g>
</g>
<text x="64" y="68" fill="#f8fafc" font-size="40" font-family="system-ui,sans-serif" font-weight="800">WFM study loop</text>
<text x="64" y="104" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">Orientation for workforce management. SKU scope in py6u9h is Enterprise, CCE, and CCX.</text>
<text x="64" y="128" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">Multi-tenant fit stays unverified.</text>
<path d="M 280 660 L 500 660 L 720 660 L 960 420" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
<g class="hop"><rect x="163.0" y="624.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="155.0" y="612.0" width="250" height="96" rx="20" fill="#fcd34d"/><rect x="155.0" y="612.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="280" y="666.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">History</text><text x="280" y="690.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 1</text></g>
<g class="hop"><rect x="383.0" y="624.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="375.0" y="612.0" width="250" height="96" rx="20" fill="#fb7185"/><rect x="375.0" y="612.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="500" y="666.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Forecast</text><text x="500" y="690.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 2</text></g>
<g class="hop"><rect x="603.0" y="624.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="595.0" y="612.0" width="250" height="96" rx="20" fill="#fef3c7"/><rect x="595.0" y="612.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="720" y="666.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Schedule</text><text x="720" y="690.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 3</text></g>
<g class="hop"><rect x="843.0" y="384.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="835.0" y="372.0" width="250" height="96" rx="20" fill="#f97316"/><rect x="835.0" y="372.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="960" y="426.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Adhere</text><text x="960" y="450.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 4</text></g>
<g filter="url(#glow)">
<animateMotion dur="5.2s" repeatCount="indefinite" path="M 280 660 L 500 660 L 720 660 L 960 420"/>
<circle r="16" fill="#f97316" opacity="0.55"/>
<circle r="7" fill="#ffffff"/>
</g>
<text x="64" y="860" fill="#bae6fd" font-size="16" font-family="system-ui,sans-serif">Study drawing. Read the room before you treat a hop as a product limit.</text>
</svg>
