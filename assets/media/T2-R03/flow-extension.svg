fix, steering</text><text x="356.0" y="216" fill="#94a3b8" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">digit</text><g class="pulse p1"><circle cx="524.0" cy="174" r="11" fill="#a5b4fc"/><text x="524.0" y="178" text-anchor="middle" fill="#082033" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="800">2</text></g></g><g><rect x="560.0" y="148" width="230" height="112" rx="16" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/><rect x="560.0" y="148" width="230" height="7" rx="3" fill="#fbbf24"/><g transform="translate(572.0,182.0) scale(1.0)" fill="none" stroke="#fbbf24" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s5.6-4.8 5.6-9.2a5.6 5.6 0 1 0-11.2 0c0 4.4 5.6 9.2 5.6 9.2z"/><circle cx="12" cy="11.2" r="1.8"/></g><text x="606.0" y="184" fill="#f8fafc" font-size="14" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="750">Location prefix</text><text x="606.0" y="202" fill="#94a3b8" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">Unique on that site</text><g class="pulse p2"><circle cx="774.0" cy="174" r="11" fill="#fbbf24"/><text x="774.0" y="178" text-anchor="middle" fill="#082033" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="800">3</text></g></g><g><rect x="810.0" y="148" width="230" height="112" rx="16" fill="#0b1220" stroke="#fb7185" stroke-width="2"/><rect x="810.0" y="148" width="230" height="7" rx="3" fill="#fb7185"/><g transform="translate(822.0,182.0) scale(1.0)" fill="none" stroke="#fb7185" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="8" width="6.6" height="8" rx="1.4"/><rect x="14.2" y="8" width="6.6" height="8" rx="1.4"/><path d="M9.8 12h4.4"/></g><text x="856.0" y="184" fill="#f8fafc" font-size="14" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="750">Route group</text><text x="856.0" y="202" fill="#94a3b8" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">Up to 10 trunks</text><g class="pulse p3"><circle cx="1024.0" cy="174" r="11" fill="#fb7185"/><text x="1024.0" y="178" text-anchor="middle" fill="#082033" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="800">4</text></g></g><path class="march" d="M290.0 204.0 L310.0 204.0" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" opacity="0.9"/><text class="pulse p0" x="300.0" y="190.0" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">Match</text><g class="pkt" filter="url(#T2R03flowextensionsvg-soft)"><circle r="7" fill="#22d3ee" stroke="#ffffff" stroke-width="2"><animateMotion dur="2.8s" begin="0.0s" repeatCount="indefinite" path="M290.0 204.0 L310.0 204.0"/></circle></g><path class="march" d="M540.0 204.0 L560.0 204.0" fill="none" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round" opacity="0.9"/><text class="pulse p1" x="550.0" y="190.0" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">Prefix</text><g class="pkt" filter="url(#T2R03flowextensionsvg-soft)"><circle r="7" fill="#a5b4fc" stroke="#ffffff" stroke-width="2"><animateMotion dur="2.8s" begin="0.4s" repeatCount="indefinite" path="M540.0 204.0 L560.0 204.0"/></circle></g><path class="march" d="M790.0 204.0 L810.0 204.0" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" opacity="0.9"/><text class="pulse p2" x="800.0" y="190.0" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">Route</text><g class="pkt" filter="url(#T2R03flowextensionsvg-soft)"><circle r="7" fill="#fbbf24" stroke="#ffffff" stroke-width="2"><animateMotion dur="2.8s" begin="0.8s" repeatCount="indefinite" path="M790.0 204.0 L810.0 204.0"/></circle></g><g class="pkt" filter="url(#T2R03flowextensionsvg-soft)"><circle r="7" fill="#ffffff" stroke="#ffffff" stroke-width="2"><animateMotion dur="7s" begin="0.2s" repeatCount="indefinite" path="M175.0 204.0 L425.0 204.0 L675.0 204.0 L925.0 204.0"/></circle></g><text x="28" y="436" fill="#cbd5e1" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">Internal dialing is set on the organization. The location adds a unique prefix. The route group points at</text><text x="28" y="452" fill="#cbd5e1" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">trunks.</text>
