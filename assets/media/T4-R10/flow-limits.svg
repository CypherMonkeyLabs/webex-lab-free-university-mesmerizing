.canon-svg .p6{animation-delay:4.2s}
.canon-svg .march{stroke-dasharray:7 9;animation:canon-march 1.15s linear infinite}
.canon-svg .ex-step{opacity:.4;animation:canon-ex 12s ease-in-out infinite}
.canon-svg .e0{animation-delay:0s}.canon-svg .e1{animation-delay:3s}
.canon-svg .e2{animation-delay:6s}.canon-svg .e3{animation-delay:9s}
.canon-svg .spin{transform-box:fill-box;transform-origin:center;animation:canon-spin 22s linear infinite}
@keyframes canon-pulse{0%,100%{opacity:.42}35%,65%{opacity:1}}
@keyframes canon-march{to{stroke-dashoffset:-32}}
@keyframes canon-ex{0%,100%{opacity:.38}6%,20%{opacity:1}}
@keyframes canon-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .canon-svg .pkt{display:none !important}
  .canon-svg .pulse,.canon-svg .march,.canon-svg .ex-step,.canon-svg .spin{animation:none !important}
  .canon-svg .pulse,.canon-svg .ex-step{opacity:1 !important}
  .canon-svg .march{stroke-dasharray:none !important}
}
</style>

