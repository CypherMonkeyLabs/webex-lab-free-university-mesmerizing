="11" font-family="ui-sans-serif,system-ui,sans-serif">Cross-connect or Fabric. VRF and BGP</text><g class="pulse p1"><circle cx="1024" cy="118.0" r="11" fill="#a5b4fc"/><text x="1024" y="122.0" text-anchor="middle" fill="#082033" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="800">2</text></g></g><path class="march" d="M298.0 215.0 C459.0 215.0 459.0 135.0 620.0 135.0" fill="none" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round"/><text class="pulse p0" x="459.0" y="165.0" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="700">Private</text><g class="pkt" filter="url(#T5R03flowthreesvg-soft)"><circle r="7" fill="#a5b4fc" stroke="#ffffff" stroke-width="2"><animateMotion dur="3.2s" begin="0.0s" repeatCount="indefinite" path="M298.0 215.0 C459.0 215.0 459.0 135.0 620.0 135.0"/></circle></g><g><rect x="620" y="188.66666666666669" width="420" height="86" rx="16" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/><rect x="620" y="188.66666666666669" width="420" height="7" rx="3" fill="#fbbf24"/><g transform="translate(632.0,222.7) scale(1.0)" fill="none" stroke="#fbbf24" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="11" width="12" height="8" rx="2"/><path d="M8.2 11V8.2a3.8 3.8 0 0 1 7.6 0V11"/></g><text x="666" y="224.66666666666669" fill="#f8fafc" font-size="14" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="750">Virtual Connect</text><text x="666" y="242.66666666666669" fill="#94a3b8" font-size="11" font-family="ui-sans-serif,system-ui,sans-serif">Two tunnels, 250 Mbps each</text><g class="pulse p2"><circle cx="1024" cy="214.66666666666669" r="11" fill="#fbbf24"/><text x="1024" y="218.66666666666669" text-anchor="middle" fill="#082033" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif" font-weight="800">3</text></g></g><path class="march" d="M298.0 215.0 C459.0 215.0 459.0 231.7 620.0 231.7" fill="none" strok