 path="M298.0 215.0 C459.0 215.0 459.0 328.3 620.0 328.3"/></circle></g><text x="28" y="406" fill="#cbd5e1" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">Partner Connect is a private aggregation. Virtual Connect is an internet VPN. Edge Connect is private</text><text x="28" y="422" fill="#cbd5e1" font-size="12" font-family="ui-sans-serif,system-ui,sans-serif">peering.</text>
