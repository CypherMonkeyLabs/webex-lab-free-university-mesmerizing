<desc id="T7R06flowivrsvg-desc">Hunt groups and call queues can name an auto attendant as the IVR. The hunt group note says not based on skills.</desc>
<style>
.canon-svg .pulse{animation:canon-pulse 4.8s ease-in-out infinite}
