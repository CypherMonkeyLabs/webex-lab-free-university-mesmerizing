<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-layout="corners" role="img" aria-label="AI agent handoff"><title>Ai Handoff</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#082f49"/><stop offset="0.55" stop-color="#312e81"/><stop offset="1" stop-color="#701a75"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="900" fill="url(#sky)"/>
<g opacity="0.5">
<animateTransform attributeName="transform" type="translate" values="0 0; 0 12; 0 0" dur="11s" repeatCount="indefinite"/>
<circle cx="140" cy="150" r="110" fill="#22d3ee" opacity="0.22"/>
<circle cx="860" cy="240" r="80" fill="#a5b4fc" opacity="0.2"/>
<circle cx="640" cy="780" r="130" fill="#fbbf24" opacity="0.14"/>
</g>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0; -16 10; 0 0" dur="18s" repeatCount="indefinite"/>
<g opacity="0.28" stroke="#67e8f9" stroke-width="1"><line x1="60" y1="150" x2="20" y2="820" />
<line x1="140" y1="150" x2="106" y2="820" />
<line x1="220" y1="150" x2="192" y2="820" />
<line x1="300" y1="150" x2="278" y2="820" />
<line x1="380" y1="150" x2="364" y2="820" />
<line x1="460" y1="150" x2="450" y2="820" />
<line x1="540" y1="150" x2="536" y2="820" />
<line x1="620" y1="150" x2="622" y2="820" />
<line x1="700" y1="150" x2="708" y2="820" />
<line x1="780" y1="150" x2="794" y2="820" />
<line x1="860" y1="150" x2="880" y2="820" />
<line x1="940" y1="150" x2="966" y2="820" />
<line x1="1020" y1="150" x2="1052" y2="820" />
<line x1="1100" y1="150" x2="1138" y2="820" /></g>
</g>
<text x="64" y="68" fill="#f8fafc" font-size="40" font-family="system-ui,sans-serif" font-weight="800">AI agent handoff</text>
<text x="64" y="104" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">Bring-your-own virtual agent must escalate with AGENT_TRANSFER.</text>
<path d="M 300 300 L 900 300 L 300 680 L 900 680" fill="none" stroke="#fb7185" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
<g class="hop"><rect x="183.0" y="264.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="175.0" y="252.0" width="250" height="96" rx="20" fill="#22d3ee"/><rect x="175.0" y="252.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="300" y="306.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Caller</text><text x="300" y="330.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 1</text></g>
<g class="hop"><rect x="783.0" y="264.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="775.0" y="252.0" width="250" height="96" rx="20" fill="#a5b4fc"/><rect x="775.0" y="252.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="900" y="306.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Virtual agent</text><text x="900" y="330.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 2</text></g>
<g class="hop"><rect x="183.0" y="644.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="175.0" y="632.0" width="250" height="96" rx="20" fill="#fbbf24"/><rect x="175.0" y="632.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="300" y="686.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">AGENT_TRANSFER</text><text x="300" y="710.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 3</text></g>
<g class="hop"><rect x="783.0" y="644.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="775.0" y="632.0" width="250" height="96" rx="20" fill="#fb7185"/><rect x="775.0" y="632.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="900" y="686.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Human queue</text><text x="900" y="710.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 4</text></g>
<g filter="url(#glow)">
<animateMotion dur="4.5s" repeatCount="indefinite" path="M 300 300 L 900 300 L 300 680 L 900 680"/>
<circle r="16" fill="#fb7185" opacity="0.55"/>
<circle r="7" fill="#ffffff"/>
</g>
<text x="64" y="860" fill="#bae6fd" font-size="16" font-family="system-ui,sans-serif">Study drawing. Read the room before you treat a hop as a product limit.</text>
</svg>
