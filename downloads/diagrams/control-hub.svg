<animateTransform attributeName="transform" type="translate" values="0 0; -16 10; 0 0" dur="18s" repeatCount="indefinite"/>
<g opacity="0.16"><rect x="0" y="200" width="1200" height="18" fill="#d9f99d"/>
<rect x="0" y="280" width="1200" height="18" fill="#d9f99d"/>
<rect x="0" y="360" width="1200" height="18" fill="#d9f99d"/>
<rect x="0" y="440" width="1200" height="18" fill="#d9f99d"/>
<rect x="0" y="520" width="1200" height="18" fill="#d9f99d"/>
