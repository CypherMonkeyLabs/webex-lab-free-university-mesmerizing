<g class="hop"><rect x="183.0" y="234.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="175.0" y="222.0" width="250" height="96" rx="20" fill="#86efac"/><rect x="175.0" y="222.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="300" y="276.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Organization</text><text x="300" y="300.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 2</text></g>
<g class="hop"><rect x="783.0" y="234.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="775.0" y="222.0" width="250" height="96" rx="20" fill="#fde047"/><rect x="775.0" y="222.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="900" y="276.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Users and roles</text><text x="900" y="300.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 3</text></g>
<g class="hop"><rect x="483.0" y="684.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="475.0" y="672.0" width="250" height="96" rx="20" fill="#facc15"/><rect x="475.0" y="672.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="600" y="726.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Services</text><text x="600" y="750.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 4</text></g>
<g filter="url(#glow)">
