<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-layout="hub" role="img" aria-label="Control Hub"><title>Control Hub</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#365314"/><stop offset="0.55" stop-color="#166534"/><stop offset="1" stop-color="#854d0e"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="900" fill="url(#sky)"/>
<g opacity="0.5">
<animateTransform attributeName="transform" type="translate" values="0 0; 0 12; 0 0" dur="16s" repeatCount="indefinite"/>
<circle cx="325" cy="150" r="110" fill="#bef264" opacity="0.22"/>
<circle cx="975" cy="240" r="80" fill="#86efac" opacity="0.2"/>
<circle cx="640" cy="780" r="130" fill="#fde047" opacity="0.14"/>
</g>
