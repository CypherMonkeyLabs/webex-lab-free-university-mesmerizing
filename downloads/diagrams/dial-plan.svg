<?xml version="1.0" encoding="UTF-8"?>
<svg data-src-base="900" width="1200" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1434" role="img" aria-label="Dial plan"><title>Dial Plan</title>
<defs>
<linearGradient id="dialplansky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="0.55" stop-color="#0369a1"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
<filter id="dialplanglow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="900" fill="url(#dialplansky)"/>
<text x="64" y="68" fill="#f8fafc" font-size="40" font-family="system-ui,sans-serif" font-weight="800">Dial plan</text>
<text x="64" y="104" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">Study drawing. Wildcard rules are not copied from a live dial plan.</text>
<path d="M 260 250 L 480 400 L 720 550 L 960 700" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
<g class="hop"><rect x="143" y="214" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="135" y="202" width="250" height="96" rx="20" fill="#67e8f9"/><rect x="135" y="202" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="260" y="256" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Digits</text><text x="260" y="280" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 1</text></g><g class="hop"><rect x="363" y="364" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="355" y="352" width="250" height="96" rx="20" fill="#a5b4fc"/><rect x="355" y="352" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="480" y="406" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Route</text><text x="480" y="430" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 2</text></g><g class="hop"><rect x="603" y="514" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="595" y="502" width="250" height="96" rx="20" fill="#99f6e4"/><rect x="595" y="502" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="720" y="556" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Trunk</text><text x="720" y="580" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 3</text></g><g class="hop"><rect x="843" y="664" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="835" y="652" width="250" height="96" rx="20" fill="#22d3ee"/><rect x="835" y="652" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="960" y="706" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">PSTN</text><text x="960" y="730" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 4</text></g>
<g filter="url(#dialplanglow)">
<animateMotion dur="6.6s" repeatCount="indefinite" path="M 260 250 L 480 400 L 720 550 L 960 700"/>
<circle r="16" fill="#22d3ee" opacity="0.55"/>
<circle r="7" fill="#ffffff"/>
</g>
<text x="64" y="860" fill="#bae6fd" font-size="16" font-family="system-ui,sans-serif">Study drawing. Not a vendor limit.</text>
