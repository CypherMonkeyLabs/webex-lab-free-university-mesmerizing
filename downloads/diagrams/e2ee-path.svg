<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-layout="n-path" role="img" aria-label="Calling encryption"><title>E2ee Path</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#451a03"/><stop offset="0.55" stop-color="#9a3412"/><stop offset="1" stop-color="#7c2d12"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="900" fill="url(#sky)"/>
<g opacity="0.5">
<animateTransform attributeName="transform" type="translate" values="0 0; 0 16; 0 0" dur="16s" repeatCount="indefinite"/>
<circle cx="267" cy="150" r="110" fill="#fdba74" opacity="0.22"/>
<circle cx="893" cy="240" r="80" fill="#fca5a5" opacity="0.2"/>
<circle cx="640" cy="780" r="130" fill="#fde68a" opacity="0.14"/>
</g>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0; -16 10; 0 0" dur="18s" repeatCount="indefinite"/>
<g opacity="0.3" fill="none" stroke="#fed7aa" stroke-width="3"><path d="M600 180 L980 420 L820 780 L380 780 L220 420 Z"/><path d="M600 260 L860 430 L760 700 L440 700 L340 430 Z"/></g>
</g>
<text x="64" y="68" fill="#f8fafc" font-size="40" font-family="system-ui,sans-serif" font-weight="800">Calling encryption</text>
<text x="64" y="104" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">E2EE is opportunistic and off by default. Recording, auto attendant, and a mixer drop</text>
<text x="64" y="128" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">it.</text>
<path d="M 280 260 L 280 700 L 920 260 L 920 700" fill="none" stroke="#fb7185" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
<g class="hop"><rect x="163.0" y="224.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="155.0" y="212.0" width="250" height="96" rx="20" fill="#fdba74"/><rect x="155.0" y="212.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="280" y="266.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">SRTP</text><text x="280" y="290.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 1</text></g>
<g class="hop"><rect x="163.0" y="664.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="155.0" y="652.0" width="250" height="96" rx="20" fill="#fca5a5"/><rect x="155.0" y="652.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="280" y="706.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">E2EE toggle</text><text x="280" y="730.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 2</text></g>
<g class="hop"><rect x="803.0" y="224.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="795.0" y="212.0" width="250" height="96" rx="20" fill="#fde68a"/><rect x="795.0" y="212.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="920" y="266.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Client support</text><text x="920" y="290.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 3</text></g>
<g class="hop"><rect x="803.0" y="664.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="795.0" y="652.0" width="250" height="96" rx="20" fill="#fb7185"/><rect x="795.0" y="652.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="920" y="706.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Downgrade</text><text x="920" y="730.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 4</text></g>
<g filter="url(#glow)">
<animateMotion dur="5.2s" repeatCount="indefinite" path="M 280 260 L 280 700 L 920 260 L 920 700"/>
<circle r="16" fill="#fb7185" opacity="0.55"/>
<circle r="7" fill="#ffffff"/>
</g>
<text x="64" y="860" fill="#bae6fd" font-size="16" font-family="system-ui,sans-serif">Study drawing. Read the room before you treat a hop as a product limit.</text>
</svg>
