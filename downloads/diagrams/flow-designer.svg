<text x="64" y="68" fill="#f8fafc" font-size="40" font-family="system-ui,sans-serif" font-weight="800">Flow Designer</text>
<text x="64" y="104" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">Start Flow cannot be removed. Validation starts off. Publish waits for a clean check.</text>
<path d="M 250 260 L 950 260 L 420 700 L 780 700" fill="none" stroke="#e879f9" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
<g class="hop"><rect x="133.0" y="224.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="125.0" y="212.0" width="250" height="96" rx="20" fill="#f0abfc"/><rect x="125.0" y="212.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="250" y="266.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Start Flow</text><text x="250" y="290.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 1</text></g>
<g class="hop"><rect x="833.0" y="224.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="825.0" y="212.0" width="250" height="96" rx="20" fill="#fb7185"/><rect x="825.0" y="212.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="950" y="266.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Menu / Play</text><text x="950" y="290.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 2</text></g>
<g class="hop"><rect x="303.0" y="664.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="295.0" y="652.0" width="250" height="96" rx="20" fill="#fde68a"/><rect x="295.0" y="652.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="420" y="706.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Queue Contact</text><text x="420" y="730.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 3</text></g>
<g class="hop"><rect x="663.0" y="664.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="655.0" y="652.0" width="250" height="96" rx="20" fill="#e879f9"/><rect x="655.0" y="652.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="780" y="706.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Disconnect</text><text x="780" y="730.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 4</text></g>
<g filter="url(#glow)">
<animateMotion dur="7.3s" repeatCount="indefinite" path="M 250 260 L 950 260 L 420 700 L 780 700"/>
<circle r="16" fill="#e879f9" opacity="0.55"/>
<circle r="7" fill="#ffffff"/>
</g>
<text x="64" y="860" fill="#bae6fd" font-size="16" font-family="system-ui,sans-serif">Study drawing. Read the room before you treat a hop as a product limit.</text>
