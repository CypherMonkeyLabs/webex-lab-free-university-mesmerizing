<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-layout="funnel" role="img" aria-label="Flow Designer"><title>Flow Designer</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a044e"/><stop offset="0.55" stop-color="#86198f"/><stop offset="1" stop-color="#9f1239"/></linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="900" fill="url(#sky)"/>
<g opacity="0.5">
<animateTransform attributeName="transform" type="translate" values="0 0; 0 28; 0 0" dur="13s" repeatCount="indefinite"/>
<circle cx="378" cy="150" r="110" fill="#f0abfc" opacity="0.22"/>
<circle cx="962" cy="240" r="80" fill="#fb7185" opacity="0.2"/>
<circle cx="640" cy="780" r="130" fill="#fde68a" opacity="0.14"/>
</g>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0; -16 10; 0 0" dur="18s" repeatCount="indefinite"/>
<g opacity="0.28" stroke="#fbcfe8" stroke-width="1"><line x1="60" y1="150" x2="20" y2="820" />
<line x1="140" y1="150" x2="106" y2="820" />
<line x1="220" y1="150" x2="192" y2="820" />
<line x1="300" y1="150" x2="278" y2="820" />
<line x1="380" y1="150" x2="364" y2="820" />
