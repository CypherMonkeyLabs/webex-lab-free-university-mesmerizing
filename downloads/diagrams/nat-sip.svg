<g class="hop"><rect x="583.0" y="644.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="575.0" y="632.0" width="250" height="96" rx="20" fill="#5eead4"/><rect x="575.0" y="632.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="700" y="686.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">PAT</text><text x="700" y="710.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 2</text></g>
<g class="hop"><rect x="223.0" y="584.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="215.0" y="572.0" width="250" height="96" rx="20" fill="#fde68a"/><rect x="215.0" y="572.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="340" y="626.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Unique source</text><text x="340" y="650.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 3</text></g>
<g class="hop"><rect x="163.0" y="304.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="155.0" y="292.0" width="250" height="96" rx="20" fill="#22d3ee"/><rect x="155.0" y="292.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="280" y="346.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">SIP ALG off</text><text x="280" y="370.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 4</text></g>
