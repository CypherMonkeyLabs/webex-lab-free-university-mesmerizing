<text x="64" y="68" fill="#f8fafc" font-size="40" font-family="system-ui,sans-serif" font-weight="800">Three PSTN choices</text>
<text x="64" y="104" fill="#e0f2fe" font-size="18" font-family="system-ui,sans-serif">One PSTN choice per location. Premises PSTN uses a Local Gateway.</text>
<path d="M 600 240 L 400 500 L 800 500 L 600 720" fill="none" stroke="#fb923c" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
<g class="hop"><rect x="483.0" y="204.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="475.0" y="192.0" width="250" height="96" rx="20" fill="#2dd4bf"/><rect x="475.0" y="192.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="600" y="246.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Location</text><text x="600" y="270.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 1</text></g>
<g class="hop"><rect x="283.0" y="464.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="275.0" y="452.0" width="250" height="96" rx="20" fill="#fdba74"/><rect x="275.0" y="452.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="400" y="506.0" text-anchor="middle" fill="#082f49" font-size="17" font-family="system-ui,sans-serif" font-weight="800">Cisco Calling Plan</text><text x="400" y="530.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 2</text></g>
<g class="hop"><rect x="683.0" y="464.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="675.0" y="452.0" width="250" height="96" rx="20" fill="#fef08a"/><rect x="675.0" y="452.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="800" y="506.0" text-anchor="middle" fill="#082f49" font-size="17" font-family="system-ui,sans-serif" font-weight="800">Cloud Connected PSTN</text><text x="800" y="530.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 3</text></g>
<g class="hop"><rect x="483.0" y="684.0" width="250" height="96" rx="18" fill="#020617" opacity="0.42"/><rect x="475.0" y="672.0" width="250" height="96" rx="20" fill="#fb923c"/><rect x="475.0" y="672.0" width="250" height="24" rx="12" fill="#ffffff" opacity="0.28"/><text x="600" y="726.0" text-anchor="middle" fill="#082f49" font-size="20" font-family="system-ui,sans-serif" font-weight="800">Premises / LGW</text><text x="600" y="750.0" text-anchor="middle" fill="#082f49" font-size="13" font-family="system-ui,sans-serif" font-weight="700">Hop 4</text></g>
<g filter="url(#glow)">
<animateMotion dur="5.2s" repeatCount="indefinite" path="M 600 240 L 400 500 L 800 500 L 600 720"/>
<circle r="16" fill="#fb923c" opacity="0.55"/>
<circle r="7" fill="#ffffff"/>
</g>
<text x="64" y="860" fill="#bae6fd" font-size="16" font-family="system-ui,sans-serif">Study drawing. Read the room before you treat a hop as a product limit.</text>
</svg>
