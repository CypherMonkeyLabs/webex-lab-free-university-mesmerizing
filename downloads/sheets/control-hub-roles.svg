<text x="24" y="78" fill="#0f172a" font-size="13" font-family="system-ui,sans-serif">What is Control Hub?</text><text x="24" y="106" fill="#0f172a" font-size="13" font-family="system-ui,sans-serif">Why does it exist — what breaks without a single org console?</text><text x="24" y="134" fill="#0f172a" font-size="13" font-family="system-ui,sans-serif">What breaks if only one person holds full administrator?</text><text x="24" y="162" fill="#0f172a" font-size="13" font-family="system-ui,sans-serif">How does an admin action work end to end?</text><text x="24" y="190" fill="#0f172a" font-size="13" font-family="system-ui,sans-serif">Where do licenses sit relative to users?</text><text x="24" y="218" fill="#0f172a" font-size="13" font-family="system-ui,sans-serif">Are locations only a calling idea?</text><text x="24" y="246" fill="#0f172a" font-size="13" font-family="system-ui,sans-serif">What are the failure modes, and how do I prove which one?</text>
