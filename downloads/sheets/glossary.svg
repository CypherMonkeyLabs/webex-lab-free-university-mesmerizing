<svg data-src-base="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 944" role="img" aria-label="Glossary">
<rect width="980" height="300" fill="#0b1020"/>
<text x="36" y="48" fill="#f8fafc" font-size="28" font-family="system-ui,sans-serif" font-weight="700">Glossary</text>
<text x="36" y="78" fill="#94a3b8" font-size="14" font-family="system-ui,sans-serif">CypherMonkey · Webex Lab · not a vendor document</text>
<text x="36" y="120" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">Control Hub — The organization console.</text><text x="36" y="148" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">Local Gateway — Customer edge for premises PSTN. Not a phone registrar.</text><text x="36" y="176" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">Entry point — Where a contact-center call arrives.</text><text x="36" y="204" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">Dedicated Instance — Customer UC applications in Webex, not multi-tenant Calling.</text><text x="36" y="232" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">HELD — The location request phones use toward RedSky.</text>
