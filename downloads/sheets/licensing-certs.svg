<text x="36" y="120" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">Calling licenses — Professional, Standard, Workspace. Features differ. See n1qbbp7.</text><text x="36" y="148" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">CCNP Collaboration — 350-801 CLCOR plus one concentration.</text><text x="36" y="176" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">CLACC — 300-815. CLACCM retired February 2, 2026.</text><text x="36" y="204" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">CLHCT — 300-820. CLCEI retired February 2, 2026.</text><text x="36" y="232" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">CLCCE — 300-830 contact-center concentration.</text>
