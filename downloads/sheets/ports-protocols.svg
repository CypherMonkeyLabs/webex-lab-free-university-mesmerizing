<text x="36" y="48" fill="#f8fafc" font-size="28" font-family="system-ui,sans-serif" font-weight="700">Ports and protocols</text>
<text x="36" y="78" fill="#94a3b8" font-size="14" font-family="system-ui,sans-serif">CypherMonkey · Webex Lab · not a vendor document</text>
<text x="36" y="120" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">TCP 5062 — Certificate-based trunk signaling destination</text><text x="36" y="148" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">TCP 8934 — Registration-based trunk signaling destination</text><text x="36" y="176" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">5060–5280 — Phone SIP signaling source ports</text><text x="36" y="204" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">UDP 8000–48199 — Local gateway media source</text><text x="36" y="232" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">UDP 5004, 9000, 8500–8699, 19560–65535 — Media destinations toward Calling</text><text x="36" y="260" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">TCP 443 — RedSky hosts and most HTTPS signaling</text><text x="36" y="288" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">UDP/TCP 53 and UDP 123 — DNS and NTP</text>
