<svg data-src-base="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1142" role="img" aria-label="Security and compliance">
<rect width="980" height="300" fill="#0b1020"/>
<text x="36" y="48" fill="#f8fafc" font-size="28" font-family="system-ui,sans-serif" font-weight="700">Security and compliance</text>
<text x="36" y="78" fill="#94a3b8" font-size="14" font-family="system-ui,sans-serif">CypherMonkey · Webex Lab · not a vendor document</text>
<text x="36" y="120" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">TLS — 1.2 and 1.3 for secure SIP.</text><text x="36" y="148" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">Certificates — Server Authentication EKU. CN or SAN matches Control Hub without the port.</text><text x="36" y="176" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">SRTP — AES_CM_128_HMAC_SHA1_80.</text><text x="36" y="204" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">E2EE — Off by default. Not for PSTN. Recording disables it.</text><text x="36" y="232" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">Proxy inspection — Apps trust an OS CA. Room devices and MPP phones need TAC to install a custom CA.</text>
