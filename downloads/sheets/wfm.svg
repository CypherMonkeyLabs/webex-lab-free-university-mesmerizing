<text x="36" y="120" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">Study room — T3-R09 covers WFO and AI features named in the articles.</text><text x="36" y="148" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">SKU article — py6u9h scopes listed WFO SKUs to Enterprise, CCE, and CCX.</text><text x="36" y="176" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">Multi-tenant — Unverified. Do not apply an Enterprise SKU from habit.</text><text x="36" y="204" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">Basic WFM — The room describes forecasting coverage. Re-check nmzg380 before a design.</text><text x="36" y="232" fill="#e2e8f0" font-size="16" font-family="system-ui,sans-serif">Not Analyzer — A schedule is not a historical report.</text>
